name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  packages: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # bunfig.toml reads @skipstery packages from GitHub Packages with this token.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      # The same gate as the pre-push hook; --release: no unreleased changelog
      # entries on main (docs/VERSIONING.md). Steps are listed in scripts/verify.mjs.
      - run: bun run verify -- --release
