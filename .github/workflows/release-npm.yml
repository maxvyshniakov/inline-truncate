# Publishes the released version to npmjs.org with npm trusted publishing (OIDC)
# and, from a public repository, provenance (package-kit docs/templates/release-npm.yml).
# package-kit.config.mjs sets publish: { registry: "npm", access: "public" }.
#
# - Register this file once on npmjs.org as the package's trusted publisher:
#   npm trust github inline-truncate --file release-npm.yml --repo maxvyshniakov/inline-truncate --allow-publish
#   The OIDC claims name this workflow file, so the job stays here and does not
#   move into a reusable workflow.
# - Inside Actions, `package-kit publish` skips the release gate's own wait: the
#   check job below gates the publication.
# - Only the publish job, after check, gets id-token: write and contents: write (the tag).
name: Release to npm
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: release-npm
  cancel-in-progress: false
jobs:
  check:
    uses: maxvyshniakov/package-kit/.github/workflows/verify.yml@v1.0.1
    permissions:
      contents: read
      packages: read
  publish:
    needs: check
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: maxvyshniakov/package-kit/actions/setup-bun@v1.0.1
      - uses: maxvyshniakov/package-kit/actions/npm-publish@v1.0.1
