<!doctype html><html lang="en"><meta charset="utf-8"><title>TextTruncate highlight edges</title><style>
@font-face{font-family:Harness;src:url("/scripts/perf/fonts/InterVariable.woff2")}
@font-face{font-family:HarnessArabic;src:local("Geeza Pro"),local("Noto Naskh Arabic"),local("Arial")}
/* Tailwind's preflight makes every box border-box; the root must not depend on it. */
*,::before,::after{box-sizing:border-box}
:root{--cell:#1e1e1e;--text:#f0f0f0;--match:#ffff00;--match-fg:#000000;--text-truncate-highlight-background:var(--match);--text-truncate-highlight-foreground:var(--match-fg)}
body{margin:0;padding:8px 12px;background:var(--cell);color:var(--text);font:16px/24px Harness,HarnessArabic}
/* A cell as Data Grid's fit box lays it out: a flex row, the root filling it. */
.cell{display:flex;align-items:center;height:24px;margin:0 0 8px}
/* Data Grid's decoration (search-highlights.css) without its colour: the
   package's own highlight class must draw the foreground. Paints 1px beyond
   the glyphs each side. */
[data-slot="highlighted-match"]{background-color:var(--match);box-decoration-break:clone;-webkit-box-decoration-break:clone;box-shadow:1px 0 var(--match),-1px 0 var(--match)}
</style><link rel="stylesheet" href="/scripts/harness.css"><div id="fixture"></div><script type="module" src="/scripts/highlight/page.tsx"></script></html>
