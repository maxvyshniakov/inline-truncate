<!doctype html><html lang="en"><meta charset="utf-8"><title>Text Truncate accessible text</title><style>
body {font: 14px Arial,sans-serif;margin:16px} table{border-collapse:collapse} td{padding:0} td>[data-truncate]{width:200px} [data-truncate]{display:block;width:100%;min-width:0;overflow:hidden;white-space:nowrap} [data-truncate-strategy="css"]{text-overflow:ellipsis}
[data-slot="highlighted-match"]{position:relative;isolation:isolate;border-radius:2px}[data-slot="highlighted-match"]::before{content:"";pointer-events:none;position:absolute;inset:0;z-index:-10;border-radius:2px;background:#fde68a}</style><div id="fixture"></div><script type="module" src="/scripts/a11y/page.tsx"></script></html>
